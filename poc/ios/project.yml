name: EruriPoC
options:
  bundleIdPrefix: com.picpal.assistant
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.3"
settings:
  base:
    DEVELOPMENT_TEAM: 6626BYCJG4
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    # TestFlight: 앱·확장이 같은 버전을 쓴다. 빌드 번호는 scripts/testflight.sh 가 $(date +%Y%m%d%H%M) 으로 덮어쓴다
    MARKETING_VERSION: 0.2.2
    CURRENT_PROJECT_VERSION: "1"
packages:
  EruriCore:
    path: Packages/EruriCore
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    majorVersion: 8.0.0
targets:
  EruriPoC:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: EruriCore
      - package: GoogleSignIn
        product: GoogleSignIn
      - target: ShareExtension
    # PoC-6: GID_* ·POC_SUPABASE_* (sim.sh config 가 poc/server/.env 에서 생성, gitignore)
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    # 자동 서명(-allowProvisioningUpdates)이 App ID 에 켤 capability. 실제 값은 entitlements 파일
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS: { enabled: 1 }
        com.apple.Push: { enabled: 1 }
        com.apple.BackgroundModes: { enabled: 1 }   # 값은 App/Info.plist UIBackgroundModes(remote-notification·fetch·processing)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.picpal.assistant.poc
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"   # iPhone 전용(xcodegen 타깃 기본값 "1,2" 를 덮는다. iPad 방향 요건 회피)
      # 업로드 서버 기본값(Info.plist PocIngestDefaultURL). 설정 화면에서 바꾼 값이 우선한다
      configs:
        Debug:
          POC_INGEST_DEFAULT_URL: http://localhost:8787
        Release:
          POC_INGEST_DEFAULT_URL: https://$(POC_SUPABASE_HOST)/functions/v1
  ShareExtension:
    type: app-extension
    platform: iOS
    sources: [ShareExtension]
    dependencies:
      - package: EruriCore
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS: { enabled: 1 }
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.picpal.assistant.poc.share
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        INFOPLIST_FILE: ShareExtension/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
  EruriCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Packages/EruriCore/Tests/EruriCoreTests]
    dependencies:
      - package: EruriCore
      - target: EruriPoC
    settings:
      base:
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/EruriPoC.app/EruriPoC
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
  # 시뮬레이터 재실측용: 알림 권한 대화상자·배너 액션·단축어 앱·사진 공유 시트를 springboard 로 조작한다
  EruriPoCUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: EruriPoC
    settings:
      base:
        TEST_TARGET_NAME: EruriPoC
        GENERATE_INFOPLIST_FILE: YES
schemes:
  EruriPoC:
    build:
      targets: { EruriPoC: all, ShareExtension: all, EruriCoreTests: [test] }
    test:
      targets: [EruriCoreTests]
  EruriPoCUI:
    build:
      targets: { EruriPoC: all, ShareExtension: all, EruriPoCUITests: [test] }
    test:
      targets: [EruriPoCUITests]
