name: AssistantPoC
options:
  bundleIdPrefix: com.picpal.assistant
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.3"
settings:
  base:
    DEVELOPMENT_TEAM: 6626BYCJG4
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    # TestFlight: 앱·확장이 같은 버전을 쓴다. 빌드 번호는 scripts/testflight.sh 가 $(date +%Y%m%d%H%M) 으로 덮어쓴다
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: "1"
packages:
  AssistantCore:
    path: Packages/AssistantCore
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    majorVersion: 8.0.0
targets:
  AssistantPoC:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: AssistantCore
      - package: GoogleSignIn
        product: GoogleSignIn
      - target: ShareExtension
    # PoC-6: GID_* ·POC_SUPABASE_* (sim.sh config 가 poc/server/.env 에서 생성, gitignore)
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    # 자동 서명(-allowProvisioningUpdates)이 App ID 에 켤 capability. 실제 값은 entitlements 파일
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS: { enabled: 1 }
        com.apple.Push: { enabled: 1 }
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.picpal.assistant.poc
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"   # iPhone 전용(xcodegen 타깃 기본값 "1,2" 를 덮는다. iPad 방향 요건 회피)
  ShareExtension:
    type: app-extension
    platform: iOS
    sources: [ShareExtension]
    dependencies:
      - package: AssistantCore
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS: { enabled: 1 }
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.picpal.assistant.poc.share
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        INFOPLIST_FILE: ShareExtension/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
  AssistantCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Packages/AssistantCore/Tests/AssistantCoreTests]
    dependencies:
      - package: AssistantCore
      - target: AssistantPoC
    settings:
      base:
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/AssistantPoC.app/AssistantPoC
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
  # 시뮬레이터 재실측용: 알림 권한 대화상자·배너 액션·단축어 앱·사진 공유 시트를 springboard 로 조작한다
  AssistantPoCUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: AssistantPoC
    settings:
      base:
        TEST_TARGET_NAME: AssistantPoC
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AssistantPoC:
    build:
      targets: { AssistantPoC: all, ShareExtension: all, AssistantCoreTests: [test] }
    test:
      targets: [AssistantCoreTests]
  AssistantPoCUI:
    build:
      targets: { AssistantPoC: all, ShareExtension: all, AssistantPoCUITests: [test] }
    test:
      targets: [AssistantPoCUITests]
